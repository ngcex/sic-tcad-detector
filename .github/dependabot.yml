# Dependabot (issue #3 P3.2): weekly update PRs for the locked Python dependencies
# (uv.lock, via pyproject.toml) and for the GitHub Actions used by the workflows (the new
# workflows pin actions by commit SHA; Dependabot updates the SHA and the version comment).
# Security updates additionally need "Dependabot security updates" enabled in the
# repository settings.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
