[pytest]
testpaths = tests
markers =
    slow: marks tests as slow (devsim integration tests, >10s each)
    exhaustive: redundant deep variants (each implied by a kept smoke test); deselected by default, run with -m exhaustive (or -m "" for everything)
addopts = -m "not exhaustive" --dist loadgroup --no-loadscope-reorder
# The default layout parameter file (data/foundry/layout_params.toml) still has PLACEHOLDER
# dimensions, so every layout / spec / cross-section export warns. The warning is asserted
# with pytest.warns in tests/test_export*.py and silenced everywhere else.
filterwarnings =
    ignore::etna.export.layout_params.PlaceholderDimensionWarning
