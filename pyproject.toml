[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petringa"
version = "5.0.0"
description = "SiC TCAD Simulator Library for the Petringa group"
requires-python = ">=3.13"
dependencies = [
    "devsim>=2.10.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "plotly>=5.0",
    "streamlit>=1.30",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["petringa"]

[tool.pytest.ini_options]
pythonpath = ["."]
