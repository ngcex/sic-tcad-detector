[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpusolver"
version = "0.1.0"
description = "Batched 1D SiC electrostatics / drift-diffusion solver spike for Apple Silicon (numpy float64 + MLX float32)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "mlx>=0.20",
]

[project.optional-dependencies]
# Reference comparisons against the parent ETNA package (devsim, CPU float64).
ref = ["etna", "pytest>=7.0"]

[tool.uv.sources]
etna = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["gpusolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
