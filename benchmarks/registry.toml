status = "VERIFIED"
metric = "rel"
tolerance = 0.2
speed = "fast"
evaluator = "benchmarks.evaluators:an_bohr_variance_alpha"
reference = { source = "Bohr / Vavilov variance xi T_max (1 - beta^2/2) (etna.core.mc_transport.bohr_variance_keV2)" }
provenance = "tests/test_mc_transport.py::test_variance_close_to_vavilov gate 0.8-1.2. The +3.9 % is a model-form difference of the fluctuation model (~6x the sampling error), not statistics; at kappa < 1 the ratio is 0.76-0.85 (heavy tail)"

[[benchmark]]
