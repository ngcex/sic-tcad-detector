[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etna"
# single source of truth: etna/_version.py (__version__), read by hatch below
dynamic = ["version"]
description = "ETNA: Epitaxial Tcad Numerical Analysis — SiC TCAD simulator library for 4H-SiC detectors (INFN-LNS Petringa group)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Cesare Scalia" }]
requires-python = ">=3.13"
dependencies = [
    "devsim>=2.10.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "plotly>=5.0",
    "streamlit>=1.30",
    "pandas>=2.0",
    "numba>=0.60",
]

[project.urls]
Repository = "https://github.com/ngcex/sic-tcad-detector"
Documentation = "https://github.com/ngcex/sic-tcad-detector/blob/main/docs/USAGE.md"

[project.optional-dependencies]
# The ONE development dependency set: `uv sync --extra dev` (add `--extra viz` for the
# Export page's animations / GDSII). A plain `uv sync` installs no extras and REMOVES
# these tools from .venv (then `uv run pytest` may fall through to a system pytest,
# audit C-15): always sync with --extra dev.
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.8.0",
    "jupyter>=1.0",
    "nbstripout>=0.9.1",
    "ruff>=0.17.1",
    "meshio>=5.3.5",
]
viz = [
    "gdstk>=1.0.1",
    "manim>=0.22.0",
]

[tool.hatch.version]
path = "etna/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["etna"]
# save_figure() (etna/core/plotting.py) writes notebook figures next to the package;
# they are build artefacts, never package data.
exclude = ["etna/figures"]

# Runtime data shipped in the wheel. data/ stays at the repository root (scripts,
# notebooks and lab/ use it there); a wheel gets this subset as etna/_data/, found by
# etna/_paths.py (packaged copy first, repository data/ in a source checkout). The NIST
# ESTAR html (60 KB) is parsed at run time, so it ships; other raw
# provenance (data/nist_star/raw/, the SR-NIEL .html pages, fetch_sr_niel.py) and
# notebook-only inputs (synthetic_mc_events.csv) go to the sdist only. Mixed directories
# are listed file by file; tests/test_packaging.py fails when a new runtime csv/json in
# data/ is missing here.
[tool.hatch.build.targets.wheel.force-include]
"data/nist_estar/raw/estar_default_006.html" = "etna/_data/nist_estar/raw/estar_default_006.html"
"data/nist_estar/raw/estar_default_014.html" = "etna/_data/nist_estar/raw/estar_default_014.html"
"data/nist_estar/raw/estar_default_276.html" = "etna/_data/nist_estar/raw/estar_default_276.html"
"data/nist_estar/raw/estar_lowE_006.html" = "etna/_data/nist_estar/raw/estar_lowE_006.html"
"data/nist_estar/raw/estar_lowE_014.html" = "etna/_data/nist_estar/raw/estar_lowE_014.html"
"data/nist_estar/raw/estar_lowE_276.html" = "etna/_data/nist_estar/raw/estar_lowE_276.html"
"data/nist_estar/README.md" = "etna/_data/nist_estar/README.md"
"data/nist_star/README.md" = "etna/_data/nist_star/README.md"
"data/nist_star/astar_c_amorphous.csv" = "etna/_data/nist_star/astar_c_amorphous.csv"
"data/nist_star/astar_c_graphite.csv" = "etna/_data/nist_star/astar_c_graphite.csv"
"data/nist_star/astar_muscle_icru.csv" = "etna/_data/nist_star/astar_muscle_icru.csv"
"data/nist_star/astar_si.csv" = "etna/_data/nist_star/astar_si.csv"
"data/nist_star/astar_water.csv" = "etna/_data/nist_star/astar_water.csv"
"data/nist_star/pstar_c_amorphous.csv" = "etna/_data/nist_star/pstar_c_amorphous.csv"
"data/nist_star/pstar_c_graphite.csv" = "etna/_data/nist_star/pstar_c_graphite.csv"
"data/nist_star/pstar_muscle_icru.csv" = "etna/_data/nist_star/pstar_muscle_icru.csv"
"data/nist_star/pstar_si.csv" = "etna/_data/nist_star/pstar_si.csv"
"data/nist_star/pstar_water.csv" = "etna/_data/nist_star/pstar_water.csv"
"data/niel/README.md" = "etna/_data/niel/README.md"
"data/niel/sr_niel_proton_si_Ed21.csv" = "etna/_data/niel/sr_niel_proton_si_Ed21.csv"
"data/niel/sr_niel_proton_sic_Ed21-21.csv" = "etna/_data/niel/sr_niel_proton_sic_Ed21-21.csv"
"data/niel/sr_niel_proton_sic_Ed35-21.csv" = "etna/_data/niel/sr_niel_proton_sic_Ed35-21.csv"
"data/stopping_power_sic.csv" = "etna/_data/stopping_power_sic.csv"
"data/stopping_power_water.csv" = "etna/_data/stopping_power_water.csv"
"data/cce_let_table_100um.json" = "etna/_data/cce_let_table_100um.json"
"data/cce_let_table_300um.json" = "etna/_data/cce_let_table_300um.json"
"data/validation" = "etna/_data/validation"
"data/foundry" = "etna/_data/foundry"
"data/measurements/README.md" = "etna/_data/measurements/README.md"
"data/measurements/templates" = "etna/_data/measurements/templates"

[tool.pytest.ini_options]
pythonpath = ["."]
