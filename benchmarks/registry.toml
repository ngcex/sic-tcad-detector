# ETNA benchmark registry (issue #3, P2.2). One [[benchmark]] table per golden quantity.
#
# Keys
#   id          stable identifier (the V&V report and tests refer to it)
#   quantity    what is compared;  unit  of S and D
#   method      how S is computed (code path) and how D is obtained
#   status      VERIFIED       code vs analytic limit
#               CROSS-CHECKED  code vs code (independent solver / reference implementation)
#               CALIBRATED     agreement with the data the model (or its input) was fitted to
#               VALIDATED      comparison with a measurement that was NOT fitted
#               EXPECTED-FAIL  documented disagreement with a measurement
#               A CALIBRATED entry must never be relabelled VALIDATED (issue #3 non-goal);
#               tests/test_benchmarks.py checks the report keeps every label.
#   metric      "rel": E = S/D - 1;  "abs": E = S - D   (ASME V&V 20: E = S - D)
#   tolerance   VERIFIED / CROSS-CHECKED: gate |E| <= tolerance (the existing test gate,
#               never the measured value). Other classes: regression guard
#               |E - golden_E| <= tolerance; E itself is reported, not judged.
#   golden_E    E recorded on 2026-10-21 (macOS arm64, M4, etna 5.0.0)
#   fail_threshold  EXPECTED-FAIL only: |E| <= this would be an UNEXPECTED-PASS
#   speed       fast (default run, < 10 s each), slow (--slow), record (not evaluated:
#               the number is quoted from the named lab LOG and its command)
#   reference   value (fixed references only; computed ones come from the evaluator),
#               uncertainty (same unit as D; omitted when not stated by the source),
#               source (only sources opened and cited in the repository)
#   provenance  where the comparison is documented in the repo
#   evaluator   module:function in benchmarks/evaluators.py
#   command     how to reproduce it outside the runner

# ============================================================= VERIFIED (analytic)
[[benchmark]]
id = "AN-W-UNIFORM"
quantity = "small-signal depletion width eps*A/C at -40 V, uniform 1e15, 30 um"
unit = "um"
method = "run_cv (batched engine) vs one-sided abrupt junction with the 2kT/q Debye-tail correction and the p+ share (1 + N_D/N_A-)"
status = "VERIFIED"
metric = "rel"
tolerance = 1e-3
speed = "fast"
evaluator = "benchmarks.evaluators:an_depletion_width_uniform"
reference = { source = "W = sqrt(2 eps (V_bi - V - 2kT/q)(1 + N_D/N_A-) / (q N_D)); Sze & Ng Ch. 2 (cited in etna/core/analytical.py)" }
provenance = "etna/core/analytical.py:148 (depletion_width, without the kT term); the tolerance is the depletion-approximation remainder, which is -2e-3 at -5 V and falls with bias"
domain = "uniform doping, reverse bias >= 5 V, 300 K"

[[benchmark]]
id = "AN-MS-ND"
quantity = "N_D from the Mott-Schottky 1/C^2 slope (-5..-40 V), uniform 1e15"
unit = "cm^-3"
method = "linear fit of 1/C^2(V) from run_cv (batched) vs the input N_D"
status = "VERIFIED"
metric = "rel"
tolerance = 5e-3
speed = "fast"
evaluator = "benchmarks.evaluators:an_mott_schottky_nd"
reference = { source = "1/C^2 = 2 (V_bi - 2kT/q - V) / (q eps N_D A^2): N_D = 2 / (q eps A^2 slope)" }
provenance = "tests/test_measurements_cv.py::test_depletion_profile_recovers_uniform_doping (rtol 0.03 on the local profile); scripts/validation/cv_vs_bruzzi2023.py panel 2"
domain = "uniform doping; 1e14 / 3e14 give -5.3e-3 / -2.5e-3 with a global fit"

[[benchmark]]
id = "AN-VFD-KNEE"
quantity = "full-depletion voltage of a uniform 1e14, 10 um epi (no n+)"
unit = "V"
method = "batched reverse_sweep, 1/C^2 linear fit below full depletion, knee where 1/C^2 reaches (d/eps)^2"
status = "VERIFIED"
metric = "rel"
tolerance = 0.03
speed = "fast"
evaluator = "benchmarks.evaluators:an_full_depletion_knee_1e14"
reference = { source = "V_fd = q N_D d^2 / (2 eps) - V_bi + 2kT/q (Sze & Ng Ch. 2; etna/core/analytical.py:23 without the kT term)" }
provenance = "the Debye tail smooths the approach to reach-through: the edge-based criterion is NOT the analytic V_fd (USAGE §8 gives the two definitions)"
domain = "uniform doping, no n+ substrate"

[[benchmark]]
id = "AN-MCINTYRE-AB"
quantity = "multiplication M(x) for alpha = beta, alpha W = 0.5, constant field"
method = "etna.core.avalanche.ionization_integrals (per-edge closed-form integration)"
status = "VERIFIED"
metric = "rel"
tolerance = 1e-12
speed = "fast"
evaluator = "benchmarks.evaluators:an_mcintyre_alpha_eq_beta"
reference = { source = "McIntyre 1966: M = 1 / (1 - alpha W) for alpha = beta (cited in etna/core/avalanche.py docstring)" }
provenance = "tests/test_physics_models.py::test_integral_identity_and_constant_field_limits"

[[benchmark]]
id = "AN-MCINTYRE-N"
quantity = "electron multiplication M_n, only electrons ionize, alpha W = 0.5"
method = "etna.core.avalanche.ionization_integrals"
status = "VERIFIED"
metric = "rel"
tolerance = 1e-12
speed = "fast"
evaluator = "benchmarks.evaluators:an_mcintyre_electrons_only"
reference = { source = "M_n = exp(alpha W) (closed form, constant field)" }
provenance = "tests/test_physics_models.py::test_integral_identity_and_constant_field_limits"

[[benchmark]]
id = "AN-BD-UNIFORM"
quantity = "avalanche breakdown voltage, p+/1e12/n+ (nearly constant field), alpha = beta = a exp(-b/E)"
unit = "V"
method = "etna.core.avalanche.breakdown_voltage (Poisson + ionization integral, secant/Illinois to 1e-3 V)"
status = "VERIFIED"
metric = "rel"
tolerance = 0.03
speed = "fast"
evaluator = "benchmarks.evaluators:an_breakdown_uniform_field"
reference = { source = "a W exp(-b W / V) = 1  =>  V_BD = b W / ln(a W)" }
provenance = "tests/test_physics_models.py::test_breakdown_nearly_uniform_field_analytic (rel 0.03: the field reaches ~0.1 um into p+ and n+)"

[[benchmark]]
id = "AN-HECHT"
quantity = "two-carrier depth-averaged Hecht CCE, tau 2 ps, 50 V, 10 um"
method = "etna.core.charge_collection.hecht_cce closed form vs an independent 20001-point trapezoid of q(x)/q0"
status = "VERIFIED"
metric = "rel"
tolerance = 1e-6
speed = "fast"
evaluator = "benchmarks.evaluators:an_hecht_closed_form"
reference = { source = "Hecht, Z. Physik 77, 235 (1932), as cited in etna/core/charge_collection.py" }
provenance = "verifies the formula used by run_temperature_sweep(method='hecht'). SRH drift-diffusion does NOT reduce to Hecht away from CCE -> 1 (DD 1.75-2.6x Hecht at tau 2 ps; SRH needs both carriers): tests/test_charge_collection.py::TestCCEDDvsHecht uses abs 0.10 near CCE = 1 only"

[[benchmark]]
id = "AN-SRH-GEN"
quantity = "midgap SRH generation current density at -40 V, p+/1e15/10 um, n_i inflated to 1e8"
unit = "A/cm^2"
method = "batched dark kernel (etna.core.batched.dark.dark_sweep), TAT and Hurkx off"
status = "VERIFIED"
metric = "rel"
tolerance = 0.03
speed = "fast"
evaluator = "benchmarks.evaluators:an_srh_generation_current"
reference = { source = "J = q n_i W_eff / (tau_n + tau_p), W_eff = W - dn - dp (generation only where n, p < n_i); Sze & Ng Ch. 2" }
provenance = "no analytic generation-current test existed before; the code current is 0.70-0.90 of the naive q n_i W / 2 tau at -5..-40 V, i.e. the naive form overestimates by 11-42 % (edge correction). With the real n_i (5e-9) the SRH current is ~1e-49 A (etna/core/dark_current.py docstring)"
domain = "partially depleted epi (the edge correction fails once reached-through)"

[[benchmark]]
