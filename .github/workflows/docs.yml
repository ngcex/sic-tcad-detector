# ETNA documentation site (issue #3 P4.1): MkDocs + Material, built from mkdocs.yml and
# the existing docs/ files, deployed to GitHub Pages.
#
# NOT ENABLED: manual trigger only (Actions -> Docs -> Run workflow). Before the first
# run a maintainer must set Settings -> Pages -> Source = "GitHub Actions". To publish on
# every push to main, add `push: branches: [main]` under `on:` once that is done.
#
# mkdocs-material is pinned here instead of a pyproject extra, so the docs toolchain does
# not enter uv.lock. Local build:
#   uvx --from mkdocs==1.6.1 --with mkdocs-material==9.7.7 mkdocs build --strict
name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"

      - name: Build the site (strict, warnings fail)
        run: uvx --from mkdocs==1.6.1 --with mkdocs-material==9.7.7 mkdocs build --strict -d site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
