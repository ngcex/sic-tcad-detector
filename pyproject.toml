[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etna"
version = "5.0.0"
description = "ETNA: Epitaxial Tcad Numerical Analysis — SiC TCAD simulator library for 4H-SiC detectors (INFN-LNS Petringa group)"
requires-python = ">=3.13"
dependencies = [
    "devsim>=2.10.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "plotly>=5.0",
    "streamlit>=1.30",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["etna"]

[tool.pytest.ini_options]
pythonpath = ["."]
