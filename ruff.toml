# Lint configuration. Kept out of pyproject.toml on purpose: one file owns it. CI runs
# `ruff check .` when this file exists (.github/workflows/ci.yml).
# Scope: the package, the app, the tests and the scripts. Notebooks, lab/ (exploratory
# benches) and tool scratch directories are excluded.
# Rules: pyflakes (F: unused imports/variables, undefined names, redefinitions), syntax/IO
# errors (E9) and deprecated-syntax warnings (W6). Import sorting (I) is NOT enabled: it
# rewrites 88 import blocks in one go (an unreviewable diff for no behaviour change);
# enable it in a dedicated formatting commit if wanted. Line length is cosmetic here
# (E501 not selected) and matches black's default, the formatter the repo uses.
line-length = 88
target-version = "py313"
include = [
    "etna/**/*.py",
    "app/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "benchmarks/**/*.py",
]
extend-exclude = ["notebooks", "lab", ".claude", ".scratch"]

[lint]
select = ["F", "E9", "W6"]
